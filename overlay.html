<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BasketLive · Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif;color:white}.scoreboard{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);display:flex;align-items:stretch;min-width:680px;background:#080d16ed;border:1px solid #ffffff24;border-radius:12px;overflow:hidden;box-shadow:0 8px 35px #0008}.team{display:flex;align-items:center;gap:15px;padding:13px 22px;min-width:255px}.team.away{background:#17334a}.team.home{background:#273719}.name{font-size:20px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:46px;font-weight:900;line-height:1}.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 17px;background:#101a28;min-width:82px}.period{font-size:13px;font-weight:800;color:#b9f35a}.fouls{font-size:10px;color:#b7c2d0;margin-top:5px}.sponsor{position:absolute;bottom:1.3%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:#fff;background:#080d16d9;padding:6px 13px;border-radius:7px;font-size:15px;font-weight:700}.sponsor img{max-height:34px;max-width:110px;object-fit:contain}.empty{display:none}@media(max-width:700px){.scoreboard{min-width:0;width:96%}.team{min-width:0;flex:1;padding:10px}.name{font-size:14px;max-width:110px}.score{font-size:34px}.mid{min-width:60px;padding:6px}.fouls{font-size:8px}}
</style></head><body><div class="scoreboard"><div class="team home"><span class="name" id="homeName">LOCAL</span><strong class="score" id="homeScore">0</strong><small class="fouls" id="homeFouls">F 0</small></div><div class="mid"><span class="period" id="period">1°</span><small style="font-size:9px;color:#9aa9bb">PERÍODO</small></div><div class="team away"><span class="name" id="awayName">VISITANTE</span><strong class="score" id="awayScore">0</strong><small class="fouls" id="awayFouls">F 0</small></div></div><div class="sponsor" id="sponsorBox"><img id="sponsorImage" hidden><span id="sponsor">BasketLive</span></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.1';
const db=createClient('https://bichgdrmosqqfcxlffgq.supabase.co','sb_publishable_6Yb69CbrVEvsn0a9ZGIChg_0D3QqY9W');
const defaults={homeName:'LOCAL',awayName:'VISITANTE',homeScore:0,awayScore:0,homeFouls:0,awayFouls:0,period:1,sponsor:'',sponsorUrl:''};
function draw(s){const v={...defaults,...s};for(const k of ['homeName','awayName','homeScore','awayScore'])document.getElementById(k).textContent=v[k];document.getElementById('homeFouls').textContent='F '+v.homeFouls;document.getElementById('awayFouls').textContent='F '+v.awayFouls;document.getElementById('period').textContent=v.period+'°';document.getElementById('sponsor').textContent=v.sponsor||'BasketLive';const img=document.getElementById('sponsorImage');if(v.sponsorUrl){img.src=v.sponsorUrl;img.hidden=false}else{img.hidden=true}}
const {data}=await db.from('match_state').select('state').eq('id',1).single();draw(data?.state||defaults);
db.channel('basketlive-score').on('postgres_changes',{event:'UPDATE',schema:'public',table:'match_state',filter:'id=eq.1'},payload=>draw(payload.new.state)).subscribe();
</script></body></html>
